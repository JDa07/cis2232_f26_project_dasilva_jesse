<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/head :: headerFragment">
    <title id="pageTitle">Vehicle Rental Tracker</title>
</head>
<body>
<!--/*@thymesVar id="rentals" type="java.util.List<ca.hccis.tracker.entity.VehicleRentalTrackerData>"*/-->
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container">
    <h2 class="title is-2">Rentals Overview</h2>

    <p th:if="${#lists.isEmpty(rentals)}">No rentals to display.</p>

    <div style="width:800px; max-width:100%; height:400px;">
        <canvas id="rentalChart"></canvas>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const rentalData = /*[[${rentals}]]*/ [];
    const rentals = rentalData || [];   // an empty list if the controller sent nothing
    /*]]>*/

    // One bar group per rental, labelled with the customer's name and the rental date
    const labels = rentals.map(item => item.custFName + ' ' + item.custLName + ' (' + item.rentDate + ')');
    const rentalDays = rentals.map(item => item.rentalTimeDays);
    const saleTotals = rentals.map(item => item.saleTotal);

    // Chart.js is already loaded by fragments/head
    new Chart(document.getElementById('rentalChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Rental Days',
                    data: rentalDays,
                    backgroundColor: '#b6042a',
                    yAxisID: 'yDays'
                },
                {
                    label: 'Sale Total ($)',
                    data: saleTotals,
                    backgroundColor: '#7d0420',
                    yAxisID: 'yTotal'
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            scales: {
                // days and dollars are on very different scales, so each gets its own axis
                yDays: {
                    type: 'linear',
                    position: 'left',
                    beginAtZero: true,
                    title: { display: true, text: 'Days' }
                },
                yTotal: {
                    type: 'linear',
                    position: 'right',
                    beginAtZero: true,
                    title: { display: true, text: 'Sale Total ($)' },
                    grid: { drawOnChartArea: false }
                }
            }
        }
    });
</script>

<footer th:replace="fragments/footer :: footer"></footer>

</body>
</html>
