<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<body>
<nav th:fragment="navbar" class="navbar nav" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
        <a th:href="@{/}" class="vert-align">
            <img th:src="@{/images/ic_launcher.png}" class="logo" alt="Vehicle Rental Tracker">
        </a>

        <a role="button" class="navbar-burger burger" aria-label="menu"
           onclick="document.querySelector('.navbar-menu').classList.toggle('is-active');">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </a>
    </div>

    <div class="navbar-menu">
        <div class="navbar-end">

            <a th:href="@{/vehiclerentaltracker}" class="accent navbar-link is-arrowless">Rentals</a>

            <div class="navbar-item has-dropdown is-hoverable">
                <a th:href="@{/report}" class="accent navbar-link">Reports</a>
                <div class="accent-background navbar-dropdown">
                    <a th:href="@{/report/tracker/name}" class="accent navbar-item">By Customer Name</a>
                    <a th:href="@{/report/tracker/rental}" class="accent navbar-item">Rental Information</a>
                    <a th:href="@{/report/tracker/chart}" class="accent navbar-item">Rental Chart</a>
                </div>
            </div>
        </div>
    </div>
</nav>

</html>
