<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/head :: headerFragment">
    <title id="pageTitle">Rentals</title>
</head>
<body>
<!--/*@thymesVar id="rentals" type="java.util.List<ca.hccis.tracker.entity.VehicleRentalTrackerData>"*/-->
<nav th:replace="fragments/navHeader :: navbar"></nav>

<div class="container">
    <div class="table-title">
        <h2 class="title is-2">Rentals</h2>
        <a class="button is-link" th:href="@{/vehiclerentaltracker/add}">Add rental</a>
    </div>

    <p th:if="${#lists.isEmpty(rentals)}">No rentals yet.</p>

    <table class="tableStyles" th:unless="${#lists.isEmpty(rentals)}">
        <thead>
        <tr>
            <th>Sale ID</th>
            <th>Date</th>
            <th>First name</th>
            <th>Last name</th>
            <th>Address</th>
            <th>Vehicle</th>
            <th>Colour</th>
            <th>Days</th>
            <th>Total</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rental : ${rentals}">
            <td th:text="${rental.saleID}"></td>
            <td th:text="${rental.rentDate}"></td>
            <td th:text="${rental.custFName}"></td>
            <td th:text="${rental.custLName}"></td>
            <td th:text="${rental.custAddress}"></td>
            <td th:text="${rental.vehicleType}"></td>
            <td th:text="${rental.vehicleColour}"></td>
            <td th:text="${rental.rentalTimeDays}"></td>
            <td th:text="${#numbers.formatDecimal(rental.saleTotal, 1, 2)}"></td>
            <td>
                <a class="button is-small is-light" th:href="@{/vehiclerentaltracker/edit(id=${rental.saleID})}">Edit</a>
                <form th:action="@{/vehiclerentaltracker/delete}" method="post" style="display: inline;">
                    <input type="hidden" name="id" th:value="${rental.saleID}">
                    <input class="button is-small is-link" type="submit" value="Delete"
                           onclick="return confirm('Delete this rental?');">
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
